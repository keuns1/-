<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한국펫고등학교 실습견 일일 관리 일지 시스템 (37두 통합 관리)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {} }
    }
  </script>
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <!-- Pretendard 폰트 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    .fade-in { animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 transition-colors duration-200">

  <!-- 토스트 알림 -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- 상단 헤더 -->
  <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6">
      <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between py-3 gap-3">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-full overflow-hidden shadow-sm shrink-0 border border-slate-200 dark:border-slate-600 bg-white flex items-center justify-center">
              <img src="logo.jpg" alt="로고" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/150?text=Logo'">
            </div>
            <div>
              <div class="flex items-center gap-2 flex-wrap">
                <h1 class="text-base sm:text-lg font-extrabold text-slate-900 dark:text-white">한국펫고등학교 실습견 관리 시스템</h1>
                <span id="roleModeBadge" class="px-2.5 py-0.5 rounded-full text-[11px] font-extrabold bg-sky-100 dark:bg-sky-900/50 text-sky-800 dark:text-sky-200 border border-sky-200 dark:border-sky-800">🧑‍🎓 학생 작성 모드</span>
                <span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-emerald-50 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800 flex items-center gap-1">
                  <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>실시간 연동 중
                </span>
              </div>
              <p class="text-xs text-slate-500 dark:text-slate-400">아침·저녁 개체별 관리 기록</p>
            </div>
          </div>
          <div class="lg:hidden flex items-center gap-2">
            <button onclick="toggleTheme()" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-300"><span id="mobileThemeIcon">🌙</span></button>
            <button id="mobileTeacherAuthBtn" onclick="handleTeacherAuthButtonClick()" class="px-3 py-1.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-900 dark:bg-slate-700 text-white text-xs font-extrabold">🔒 교사 로그인</button>
          </div>
        </div>
        <div class="flex items-center justify-between lg:justify-end gap-2">
          <nav class="flex items-center gap-1 bg-slate-100 dark:bg-slate-900 p-1 rounded-2xl border border-slate-200 dark:border-slate-700">
            <button onclick="switchMainTab('write')" id="navBtn-write" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-white dark:bg-slate-700 text-sky-700 dark:text-sky-300 shadow-xs flex items-center gap-1.5">✏️ 일지 작성</button>
            <button onclick="switchMainTab('monitor')" id="navBtn-monitor" class="teacher-only-nav hidden px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold text-slate-600 dark:text-slate-400">📊 모니터링</button>
            <button onclick="switchMainTab('settings')" id="navBtn-settings" class="teacher-only-nav hidden px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold text-slate-600 dark:text-slate-400">🐶 개체 관리</button>
            <button onclick="switchMainTab('history')" id="navBtn-history" class="teacher-only-nav hidden px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold text-slate-600 dark:text-slate-400">📋 기록·엑셀</button>
          </nav>
          <div class="hidden lg:flex items-center gap-2">
            <button onclick="toggleTheme()" class="px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs sm:text-sm font-bold border border-slate-200 dark:border-slate-600 flex items-center gap-1.5">
              <span id="desktopThemeIcon">🌙</span> <span id="desktopThemeText">다크모드</span>
            </button>
            <button id="desktopTeacherAuthBtn" onclick="handleTeacherAuthButtonClick()" class="px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-900 dark:bg-slate-700 text-white text-xs sm:text-sm font-extrabold shadow-xs">🔒 교사 로그인</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- 메인 컨텐츠 -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6">
    <!-- [탭 1] 일지 작성 -->
    <section id="tabSection-write" class="max-w-3xl mx-auto space-y-5 fade-in">
      <div id="sessionSubmittedBanner" class="hidden bg-emerald-50 dark:bg-emerald-900/30 border border-emerald-400 rounded-2xl p-4 text-emerald-950 dark:text-emerald-100 shadow-xs">
        <div class="flex items-start justify-between gap-3">
          <div class="flex items-center gap-2.5">
            <span class="text-2xl">✅</span>
            <div>
              <h3 class="text-sm font-extrabold text-emerald-900 dark:text-emerald-300">관리 일지가 선생님께 안전하게 제출되었습니다!</h3>
              <p id="sessionSubmittedText" class="text-xs font-bold text-emerald-800 dark:text-emerald-400 mt-0.5"></p>
            </div>
          </div>
          <button type="button" onclick="document.getElementById('sessionSubmittedBanner').classList.add('hidden')" class="text-xs font-bold text-emerald-700 dark:text-emerald-400 hover:underline">닫기</button>
        </div>
      </div>

      <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
        <div class="bg-gradient-to-r from-[#0062B1] via-sky-700 to-blue-800 px-6 py-5 text-white flex items-center justify-between">
          <div>
            <div class="flex items-center gap-2 flex-wrap">
              <span id="formHeaderTotalDogsBadge" class="px-2.5 py-0.5 rounded-full bg-white/20 text-white text-[11px] font-bold">한국펫고등학교 실습견</span>
              <span id="formHeaderSlotStatusPill" class="px-2.5 py-0.5 rounded-full bg-amber-300 text-slate-900 text-[11px] font-extrabold">작성 대기 중</span>
            </div>
            <h2 class="text-lg sm:text-xl font-extrabold mt-1.5">✏️ 실습견 일일 관리 일지 작성</h2>
            <p class="text-xs text-sky-100 mt-0.5">아침(오전)·저녁(오후) 관리 후 즉시 작성해 주세요.</p>
          </div>
        </div>

        <form id="careLogForm" onsubmit="handleCareLogSubmit(event)" class="p-5 sm:p-7 space-y-6">
          <!-- 날짜 및 시간대 -->
          <div class="grid grid-cols-1 sm:grid-cols-12 gap-4 items-center bg-slate-50 dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-700">
            <div class="sm:col-span-5">
              <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1.5">📅 관리 일자</label>
              <input type="date" id="formDateInput" required onchange="handleFormDogOrSlotChange()" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-sm font-bold text-slate-900 dark:text-white [color-scheme:light] dark:[color-scheme:dark]">
            </div>
            <div class="sm:col-span-7">
              <label class="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-1.5">⏰ 관리 시간대 선택</label>
              <div class="grid grid-cols-2 gap-2.5">
                <button type="button" onclick="selectFormPeriod('AM')" id="periodBtn-AM" class="py-2.5 px-4 rounded-xl font-extrabold text-sm border-2 transition-all flex items-center justify-center gap-2 bg-amber-50 dark:bg-amber-900/30 border-amber-500 text-amber-900 dark:text-amber-300">☀️ 오전(아침)</button>
                <button type="button" onclick="selectFormPeriod('PM')" id="periodBtn-PM" class="py-2.5 px-4 rounded-xl font-extrabold text-sm border-2 transition-all flex items-center justify-center gap-2 bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300">🌙 오후(저녁)</button>
              </div>
            </div>
          </div>

          <!-- 강아지 선택 -->
          <div class="space-y-3.5">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <label class="text-xs font-extrabold text-slate-800 dark:text-slate-200">🐶 강아지 선택</label>
              <div class="flex flex-wrap items-center gap-1">
                <button type="button" onclick="setFormCategoryFilter('ALL')" id="formCatBtn-ALL" class="px-2.5 py-1 rounded-lg text-[11px] font-extrabold bg-sky-600 text-white">전체</button>
                <button type="button" onclick="setFormCategoryFilter('훈련')" id="formCatBtn-훈련" class="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">훈련</button>
                <button type="button" onclick="setFormCategoryFilter('미용')" id="formCatBtn-미용" class="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">미용</button>
                <button type="button" onclick="setFormCategoryFilter('입양모집')" id="formCatBtn-입양모집" class="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">입양모집</button>
              </div>
            </div>
            <input type="text" id="formDogSearchInput" oninput="populateFormDogSelectAndCards()" placeholder="🔍 강아지 또는 담당 학생 이름 검색..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-800 text-sm font-bold text-slate-900 dark:text-white">
            
            <!-- 카드 그리드 (글씨 색상 명확하게 고정) -->
            <div id="formDogQuickCards" class="grid grid-cols-2 sm:grid-cols-3 gap-2 max-h-56 overflow-y-auto p-1.5 border border-slate-200 dark:border-slate-700 rounded-2xl bg-slate-50/60 dark:bg-slate-900/60 text-slate-900 dark:text-slate-100"></div>
            
            <select id="formDogSelect" required onchange="handleFormDogOrSlotChange()" class="hidden w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-sm font-extrabold text-slate-900 dark:text-white"></select>

            <div id="selectedDogCautionBanner" class="p-4 rounded-2xl bg-amber-50 dark:bg-amber-900/20 border border-amber-300 dark:border-amber-700 text-xs space-y-1.5">
              <span class="font-extrabold text-amber-950 dark:text-amber-400 text-sm" id="cautionDogTitle">필수 관리 안내</span>
              <p id="cautionDogText" class="text-amber-900 dark:text-amber-200 font-semibold"></p>
            </div>

            <div class="bg-slate-50 dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-700">
              <label class="text-xs font-extrabold text-slate-800 dark:text-slate-200 mb-2 block">🧑‍🎓 실제 기록 학생 이름 <span class="text-rose-500">*</span></label>
              <input type="text" id="formWriterInput" required placeholder="본인 이름 입력" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-sm font-extrabold text-slate-900 dark:text-white">
              <div id="writerQuickChips" class="flex items-center gap-1.5 flex-wrap mt-2"></div>
            </div>
          </div>

          <!-- 몸무게 및 사료 -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2 border-t border-slate-100 dark:border-slate-700">
            <div class="bg-slate-50 dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-700">
              <label class="text-xs font-extrabold text-slate-800 dark:text-slate-200 block mb-1.5">⚖️ 몸무게 (kg) *</label>
              <input type="number" step="0.01" id="formWeightInput" required placeholder="예: 15.2" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-base font-extrabold text-slate-900 dark:text-white">
            </div>
            <div class="bg-slate-50 dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-700">
              <label class="text-xs font-extrabold text-slate-800 dark:text-slate-200 block mb-1.5">🥣 사료 (g) *</label>
              <input type="number" step="1" id="formFeedAmountInput" required placeholder="예: 150" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-base font-extrabold text-slate-900 dark:text-white">
              <div class="flex items-center gap-1.5 mt-2">
                <button type="button" onclick="selectFeedStatus('완식')" id="feedStatusBtn-완식" class="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-emerald-600 text-white">완식</button>
                <button type="button" onclick="selectFeedStatus('남김')" id="feedStatusBtn-남김" class="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-300">남김</button>
              </div>
            </div>
          </div>

          <!-- 산책 시간 -->
          <div class="bg-slate-50 dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-3">
            <label class="text-xs font-extrabold text-slate-800 dark:text-slate-200 block">🦮 산책 시간</label>
            <div class="grid grid-cols-2 gap-2">
              <input type="time" id="formWalkStart" class="px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-sm font-bold text-slate-900 dark:text-white [color-scheme:light] dark:[color-scheme:dark]">
              <input type="time" id="formWalkEnd" class="px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-sm font-bold text-slate-900 dark:text-white [color-scheme:light] dark:[color-scheme:dark]">
            </div>
          </div>

          <!-- 특이사항 메모 -->
          <div class="bg-slate-50 dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-700">
            <label class="text-xs font-extrabold text-slate-800 dark:text-slate-200 block mb-1.5">📝 특이사항 및 전달 메모</label>
            <textarea id="formNotesInput" rows="3" placeholder="특이사항 작성" class="w-full px-4 py-3 rounded-2xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-sm text-slate-900 dark:text-white"></textarea>
          </div>

          <div class="pt-2 flex justify-end">
            <button type="submit" class="px-8 py-3.5 rounded-2xl bg-[#0062B1] hover:bg-sky-700 text-white font-extrabold text-sm shadow-md">일지 저장 및 제출하기</button>
          </div>
        </form>
      </div>
    </section>

    <!-- [탭 2] 교사 모니터링 -->
    <section id="tabSection-monitor" class="hidden space-y-6 fade-in">
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700">
        <input type="date" id="monitorDateInput" onchange="handleMonitorDateChange(this.value)" class="px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-white [color-scheme:light] dark:[color-scheme:dark]">
      </div>
      <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 overflow-hidden">
        <table class="w-full text-left text-slate-900 dark:text-slate-100">
          <thead class="bg-slate-50 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700 text-xs font-bold">
            <tr><th class="py-3 px-4">실습견</th><th class="py-3 px-4">오전 관리</th><th class="py-3 px-4">오후 관리</th></tr>
          </thead>
          <tbody id="monitorTableBody" class="divide-y divide-slate-200 dark:divide-slate-700 text-sm"></tbody>
        </table>
      </div>
    </section>

    <section id="tabSection-settings" class="hidden space-y-6 fade-in"></section>
    <section id="tabSection-history" class="hidden space-y-6 fade-in"></section>
  </main>

  <!-- 로그인 모달 -->
  <div id="teacherLoginModal" class="fixed inset-0 z-50 hidden bg-slate-900/60 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 w-full max-w-sm border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100">
      <h3 class="text-base font-extrabold mb-4">🔒 교사 로그인 (기본값: 1974)</h3>
      <input type="password" id="teacherPinInput" class="w-full px-4 py-3 rounded-2xl border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white text-center text-lg mb-4">
      <div class="flex gap-2">
        <button onclick="closeTeacherLoginModal()" class="flex-1 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 font-bold">취소</button>
        <button onclick="handleTeacherLoginSubmit(event)" class="flex-1 py-2.5 rounded-xl bg-sky-600 text-white font-bold">확인</button>
      </div>
    </div>
  </div>

  <!-- 파이어베이스 및 로직 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    window.toggleTheme = function() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      document.getElementById('mobileThemeIcon').textContent = isDark ? '☀️' : '🌙';
      document.getElementById('desktopThemeIcon').textContent = isDark ? '☀️' : '🌙';
      document.getElementById('desktopThemeText').textContent = isDark ? '라이트모드' : '다크모드';
    };

    document.addEventListener('DOMContentLoaded', () => {
      if(document.documentElement.classList.contains('dark')) {
        document.getElementById('mobileThemeIcon').textContent = '☀️';
        document.getElementById('desktopThemeIcon').textContent = '☀️';
        document.getElementById('desktopThemeText').textContent = '라이트모드';
      }
    });

    const TODAY_STR = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;})();

    const RAW_37_DOGS = [
      { no: 1, id: 'dog-01', name: '라온', breed: '골든리트리버', location: '입양모집', emoji: '🦮', baseWeight: 26.5, recommendedFeed: 220, primaryStudent: '조현지', secondaryStudent: '김규리', thirdStudent: '', caution: '산책 후 물 급여 및 타월링', excluded: false },
      { no: 2, id: 'dog-02', name: '봉화', breed: '골든리트리버', location: '훈련', emoji: '🦮', baseWeight: 25.0, recommendedFeed: 200, primaryStudent: '김민경', secondaryStudent: '김나은', thirdStudent: '', caution: '사료 200g+유산균, 넥카라 필수', excluded: false },
      { no: 15, id: 'dog-15', name: '켈리', breed: '보더콜리', location: '훈련', emoji: '🩹', baseWeight: 14.8, recommendedFeed: 140, primaryStudent: '유하람', secondaryStudent: '차다윤', thirdStudent: '', caution: '수술 후 격리, 포비돈 소독', excluded: false }
    ];

    const state = {
      isTeacher: false, teacherPin: '1974', mainTab: 'write', monitorDate: TODAY_STR,
      formCategoryFilter: 'ALL', dogs: JSON.parse(JSON.stringify(RAW_37_DOGS)), logs: [],
      formPeriod: 'AM', formFeedStatus: '완식', db: null
    };

    function escapeHtml(str) { return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function showToast(msg, type = 'success') {
      const c = document.getElementById('toastContainer');
      const el = document.createElement('div');
      el.className = `${type==='error'?'bg-rose-600':'bg-slate-900'} text-white px-4 py-3 rounded-2xl shadow-lg text-sm font-bold flex gap-2`;
      el.innerHTML = `<span>${type==='error'?'⚠️':'✅'}</span><span>${escapeHtml(msg)}</span>`;
      c.appendChild(el); setTimeout(() => el.remove(), 3000);
    }

    async function initCloudSync() {
      try {
        const firebaseConfig = {
          apiKey: "AIzaSyChGClfqBHnOQOHkfwINVbn0fVmvFQEGS8",
          authDomain: "koreapet-c8108.firebaseapp.com",
          projectId: "koreapet-c8108",
          storageBucket: "koreapet-c8108.firebasestorage.app",
          messagingSenderId: "816355058944",
          appId: "1:816355058944:web:f5c9a69717be86a8b6bfe5"
        };
        const app = initializeApp(firebaseConfig);
        state.db = getFirestore(app);
        
        onSnapshot(collection(state.db, 'dogs'), (snap) => {
          if(snap.empty) { RAW_37_DOGS.forEach(d => setDoc(doc(state.db,'dogs',d.id), d)); }
          else {
            const arr=[]; snap.forEach(s=>arr.push(s.data()));
            state.dogs = arr.sort((a,b)=>(a.no||999)-(b.no||999));
            refreshAllViews();
          }
        });
        onSnapshot(collection(state.db, 'care_logs'), (snap) => {
          if(!snap.empty){ const arr=[]; snap.forEach(s=>arr.push(s.data())); state.logs=arr; refreshAllViews(); }
        });
      } catch (e) { console.error(e); }
    }

    window.handleTeacherAuthButtonClick = function() {
      if(state.isTeacher) { state.isTeacher=false; updateRoleUI(); switchMainTab('write'); showToast('학생 모드 전환'); }
      else { document.getElementById('teacherLoginModal').classList.remove('hidden'); document.getElementById('teacherPinInput').focus(); }
    }
    window.closeTeacherLoginModal = function() { document.getElementById('teacherLoginModal').classList.add('hidden'); }
    window.handleTeacherLoginSubmit = function(e) {
      if(e) e.preventDefault();
      if(document.getElementById('teacherPinInput').value === state.teacherPin) {
        state.isTeacher=true; closeTeacherLoginModal(); updateRoleUI(); switchMainTab('monitor'); showToast('교사 모드 해제됨');
      } else showToast('비밀번호 불일치','error');
    }
    function updateRoleUI() {
      const b1 = document.getElementById('desktopTeacherAuthBtn'), b2 = document.getElementById('mobileTeacherAuthBtn');
      const badge = document.getElementById('roleModeBadge');
      if(state.isTeacher) {
        badge.innerHTML = '🔓 교사 모드';
        b1.innerHTML = '<span>🔓</span> 교사 로그아웃'; b2.innerHTML = '<span>🔓</span> 로그아웃';
        document.querySelectorAll('.teacher-only-nav').forEach(e=>e.classList.remove('hidden'));
      } else {
        badge.innerHTML = '🧑‍🎓 학생 모드';
        b1.innerHTML = '<span>🔒</span> 교사 로그인'; b2.innerHTML = '<span>🔒</span> 교사 로그인';
        document.querySelectorAll('.teacher-only-nav').forEach(e=>e.classList.add('hidden'));
      }
    }
    window.switchMainTab = function(t) {
      if(!state.isTeacher && t!=='write') return handleTeacherAuthButtonClick();
      ['write','monitor','settings','history'].forEach(x => {
        document.getElementById(`tabSection-${x}`).classList[x===t?'remove':'add']('hidden');
      });
      refreshAllViews();
    }

    window.setFormCategoryFilter = function(c) { state.formCategoryFilter=c; populateFormDogSelectAndCards(); }
    window.populateFormDogSelectAndCards = function() {
      const q = (document.getElementById('formDogSearchInput')?.value||'').toLowerCase();
      const filtered = state.dogs.filter(d => (state.formCategoryFilter==='ALL'||d.location===state.formCategoryFilter) && 
        (!q || d.name.includes(q) || (d.primaryStudent||'').includes(q)));
      
      const c = document.getElementById('formDogQuickCards');
      if(!c) return;
      c.innerHTML = filtered.map(dog => {
        return `<button type="button" onclick="document.getElementById('formDogSelect').value='${dog.id}'; handleFormDogOrSlotChange();" 
                  class="p-2.5 rounded-xl border-2 text-left text-xs border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100">
                  ${dog.emoji} <strong>${escapeHtml(dog.name)}</strong><br><span class="text-[10px] text-slate-500 dark:text-slate-400">담당: ${escapeHtml(dog.primaryStudent)}</span>
                </button>`;
      }).join('');
    }
    window.selectFormPeriod = function(p) { state.formPeriod=p; }
    window.handleFormDogOrSlotChange = function() { populateFormDogSelectAndCards(); }
    
    window.selectFeedStatus = function(s) { state.formFeedStatus=s; }
    window.toggleCareCheckItem = function(b) { b.classList.toggle('border-sky-500'); }

    window.handleCareLogSubmit = async function(e) {
      e.preventDefault();
      if(!document.getElementById('formWriterInput').value) return showToast('작성자 필수입력', 'error');
      
      const obj = {
        id: `${document.getElementById('formDateInput').value}_${state.formPeriod}_${document.getElementById('formDogSelect').value || 'dog-01'}`,
        date: document.getElementById('formDateInput').value, period: state.formPeriod,
        writer: document.getElementById('formWriterInput').value, weight: document.getElementById('formWeightInput').value,
        feedAmount: document.getElementById('formFeedAmountInput').value, feedStatus: state.formFeedStatus,
        notes: document.getElementById('formNotesInput').value, submittedAt: new Date().toTimeString().slice(0,5)
      };
      if(state.db) await setDoc(doc(state.db, 'care_logs', obj.id), obj);
      showToast('제출 성공!');
    }

    function refreshAllViews() {
      populateFormDogSelectAndCards();
      const t = document.getElementById('monitorTableBody');
      if(t && state.isTeacher) {
        t.innerHTML = state.dogs.map(dog => {
          const am = state.logs.find(l=>l.dogId===dog.id && l.period==='AM' && l.date===document.getElementById('monitorDateInput')?.value);
          const pm = state.logs.find(l=>l.dogId===dog.id && l.period==='PM' && l.date===document.getElementById('monitorDateInput')?.value);
          return `<tr class="border-b dark:border-slate-700">
            <td class="py-2 px-4">${dog.emoji} ${dog.name}</td>
            <td class="py-2 px-4 ${!am?'text-rose-500':''}">${am ? '✅'+am.writer : '❌미작성'}</td>
            <td class="py-2 px-4 ${!pm?'text-rose-500':''}">${pm ? '✅'+pm.writer : '❌미작성'}</td>
          </tr>`;
        }).join('');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('formDateInput').value = TODAY_STR;
      document.getElementById('monitorDateInput').value = TODAY_STR;
      initCloudSync();
    });
  </script>
</body>
</html>
